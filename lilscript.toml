[policy]
version = 3
[javascript]
priority = "size-first"
assume_pristine_builtins = false
keep_published_function_names = true
[effort]
level = 13
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true
[delivery]
mode = "single"
directory = "."
select = ["index"]
entry_names = "posthog.esm.js"
[delivery.entries]
browser = "src/browser.lil"
index = "src/entry.lil"
[[delivery.also]]
name = "cjs"
entries = ["index"]
format = "cjs"
es_module_marker = "always"
entry_names = "posthog.cjs"
[[delivery.also]]
name = "browser"
entries = ["browser"]
format = "iife"
exports = "default"
global = "posthogLil"
global_binding = "property"
entry_names = "posthog.umd.js"
