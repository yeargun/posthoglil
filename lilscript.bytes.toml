[javascript]
# The raw artifact publishes its names, not `fn.name`: its bars mangle every
# published function, and reflecting the source name costs about 1,000 bytes.
keep_published_function_names = false
priority = "size-first"
optimization_level = 15
cost_model = "raw"
assume_pristine_builtins = true
strip_console = true
candidate_search = "production"

[mangle]
identifiers = true
properties = true
pool_strings = true
