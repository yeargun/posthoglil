[policy]
version = 3
[javascript]
priority = "size-first"
assume_pristine_builtins = false
keep_published_function_names = true
[effort]
level = 13
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true
[delivery]
mode = "single"
directory = "."
select = ["index"]
entry_names = "error-tracking.esm.js"
[delivery.entries]
index = "../../src/error-tracking-entry.lil"
[[delivery.also]]
name = "cjs"
entries = ["index"]
format = "cjs"
es_module_marker = "always"
entry_names = "error-tracking.cjs"
