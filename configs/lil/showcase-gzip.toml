# Showcase build of one submodule for the gzip objective (whole program, one file).
[policy]
version = 3
[language]
absence = "unified"
field_initialization = "explicit"
char_code_at = "number"
[javascript]
priority = "size-first"
# upstream's npm output is ES2015-level syntax (no ?. or ??) for its browserslist
ecmascript = "es2020"
# upstream's own build compresses with Terser's unsafe_regexp/unsafe_methods/unsafe_math: the same assumption
assume_pristine_builtins = true
# and Terser's pure_getters: true
assume_pure_property_reads = true
# and its mangle.properties: `_` names are private except rollup.config.mjs's reserved list
assume_private_underscore_properties = true
# and its compress folds `x === null || x === undefined` into `null == x`: no value is document.all
assume_no_document_all = true
# upstream's source writes these copies as object spread, which defines an own `__proto__` key where Object.assign would set the prototype
assume_no_proto_keys = true
strip_debug = false
# upstream's npm build mangles function and class names too
keep_published_function_names = false
[effort]
level = 13
[objective]
codecs = "gzip"
[mangle]
identifiers = true
properties = true
pool_strings = true
preserve_properties = ["_", "_Departed", "_POSTHOG_REMOTE_CONFIG", "__POSTHOG_INSTRUMENTED__", "__PosthogExtensions__", "__Posthog__", "__SV", "__await", "__context", "__esModule", "__ln", "__ph_loaded", "__posthog_debug", "__posthog_wrapped__", "__proto__", "__publicField2", "__rrweb_original__", "__symbol__", "_addCaptureHook", "_args", "_batchKey", "_calculate_event_properties", "_classCallCheck", "_conversations", "_conversationsManager", "_createClass", "_css", "_cssText", "_dom_loaded", "_execute_array", "_forceAllowLocalhostNetworkCapture", "_handle_unload", "_i", "_init", "_instance", "_invoke", "_isIdentified", "_is_bot", "_kx", "_map", "_mappings", "_mirror", "_noHeatmaps", "_noTruncate", "_onCapture", "_onclick", "_oncontextmenu", "_ondblclick", "_onload", "_onmousedown", "_onmouseenter", "_onmouseleave", "_onmousemove", "_onmouseout", "_onmouseover", "_opts", "_overrideSDKInfo", "_patchFetch", "_patchXHR", "_posthog", "_processor", "_root", "_rrweb", "_sb", "_send_request", "_sessionActivityTimestamp", "_sessionStartTimestamp", "_sessionTimeoutMs", "_surveyEventReceiver", "_surveyManager", "_unchangedStyles", "_url", "alias", "calculateEventProperties", "capture", "captureException", "getActiveMatchingSurveys", "getSurveys", "has_opted_out_capturing", "identify", "isFeatureEnabled", "loadExternalDependency", "onActiveMatchingSurveysChanged", "onFeatureFlags", "opt_in_capturing", "opt_out_capturing", "posthog", "register", "register_once", "reset", "set", "set_config", "set_once", "surveys", "unregister", "version"]
