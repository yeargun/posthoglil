[policy]
version = 3
[javascript]
priority = "size-first"
assume_pristine_builtins = false
# These exports are private linker boundaries; SDK and utility-package API names are preserved separately.
keep_published_function_names = false
[effort]
level = 13
[objective]
codecs = "raw"
[mangle]
identifiers = true
properties = true
pool_strings = true
